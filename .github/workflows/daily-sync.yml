name: Daily Email Tracker Sync

on:
  schedule:
    # Runs daily at 1 AM EST (6 AM UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      user_email:
        description: 'Specific user email to run for (leave empty for all users)'
        required: false
        default: ''
      backfill:
        description: 'Fetch more history (90 days)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      recompute_stats:
        description: 'Recompute daily_stats from authoritative tables (one-time data repair, no Gmail fetch)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      airtable_weeks:
        description: 'Completed weeks to write to the Airtable competency table (default 2; use 12 to backfill)'
        required: false
        default: '2'
      airtable_only:
        description: 'Only write to Airtable (skip the Gmail sync)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      interview_dry_run:
        description: 'Interview hours: print what would be written, write nothing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      debug:
        description: 'Print threads where user sent but no pair was found (use with a specific user_email)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "GOOGLE_CREDENTIALS_FILE=credentials.json" >> .env

      - name: Run tracker
        if: github.event.inputs.airtable_only != 'true'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.user_email }}" ]; then
            ARGS="$ARGS --user ${{ github.event.inputs.user_email }}"
          fi
          if [ "${{ github.event.inputs.backfill }}" == "true" ]; then
            ARGS="$ARGS --backfill"
          fi
          if [ "${{ github.event.inputs.recompute_stats }}" == "true" ]; then
            ARGS="$ARGS --recompute-stats"
          fi
          if [ "${{ github.event.inputs.debug }}" == "true" ]; then
            ARGS="$ARGS --debug"
          fi
          python tracker_supabase.py $ARGS

      - name: Write weekly figures to Airtable (competency system)
        if: always()
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_WEEKS: ${{ github.event.inputs.airtable_weeks || '2' }}
        run: python airtable_weekly_sync.py

      - name: Write interview hours to Airtable (competency system)
        if: always()
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          CALENDLY_TOKEN: ${{ secrets.CALENDLY_TOKEN }}
          HORIZON_CALENDLY_TOKEN: ${{ secrets.HORIZON_CALENDLY_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.interview_dry_run }}" == "true" ]; then
            python interview_hours_sync.py --dry-run
          else
            python interview_hours_sync.py
          fi
